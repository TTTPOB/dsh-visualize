name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck, unit tests, build.
      - run: pnpm check

      # lib/ is committed, so the build must reproduce it exactly.
      - name: Committed lib/ is up to date
        run: git diff --exit-code -- lib
